[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fathertime-hpc"
version = "0.1.0"
authors = [
  { name="Donald Paul Smith" }
]
description = "Scale-Density Kinematic Principle (SDKP) HPC Engine with 3-6-9 Vortex Logic and Metatron Graph Attention"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/FatherTimeVFE369PDGypsi3Consulting/FatherTimeSDKP-HPC-AI-Engine"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
