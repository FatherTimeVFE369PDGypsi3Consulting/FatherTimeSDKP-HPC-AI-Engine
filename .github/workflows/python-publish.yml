name: Publish FatherTimeHPC Package

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Build Tools & Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build setuptools wheel
        pip install -r requirements.txt

    - name: Test Core Pipeline Before Build
      run: python main.py

    - name: Build Package Artifacts (.whl & .tar.gz)
      run: python -m build

    - name: Attach Package Distributables to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}- name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
